---
# Ghostty is not packaged by Fedora and is not on Flathub, so it comes from a
# third-party copr. Override ghostty_copr if you would rather build it yourself.
- name: Enable the ghostty copr
  become: true
  community.general.copr:
    name: "{{ ghostty_copr }}"
    state: enabled

# Google only publishes el8 and el9 repositories; el9 is what their own Fedora
# instructions point at, and the package is a self-contained bundle anyway.
- name: Add the Google Cloud CLI repository
  become: true
  ansible.builtin.yum_repository:
    name: google-cloud-cli
    description: Google Cloud CLI
    baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-$basearch
    gpgkey: https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
    gpgcheck: true
    enabled: true

- name: Add the Docker CE repository
  become: true
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "https://download.docker.com/linux/fedora/{{ docker_releasever }}/$basearch/stable"
    gpgkey: https://download.docker.com/linux/fedora/gpg
    gpgcheck: true
    enabled: true
  when: install_docker | bool

- name: Install development tools and applications
  become: true
  ansible.builtin.dnf:
    name: "{{ packages_fedora + (packages_fedora_docker if install_docker | bool else []) }}"
    state: present

# Fedora's updates repo sets metadata_expire=6h, so a younger cache is reused
# as-is — and because Fedora prunes a package from the mirrors as soon as the
# build replacing it lands, an upgrade planned from a few-hour-old cache asks
# for rpms that were deleted hours ago. libdnf5 then aborts the transaction with
# "Failed to download packages", which the dnf5 module reports with an empty
# failures list, so the output never names the package that 404'd.
#
# The module's own update_cache cannot prevent this: it builds its RepoQuery
# before create_repos_from_system_configuration() registers anything, so it
# iterates an empty set and marks no cache expired (ansible-core 2.20.7,
# modules/dnf5.py:632). Expire the cache out of band instead; the upgrade that
# follows then refreshes it as it loads the repos.
- name: Expire the dnf metadata cache
  become: true
  ansible.builtin.command:  # noqa command-instead-of-module - update_cache is a no-op, see above
    cmd: dnf clean expire-cache
  changed_when: false
  when: bootstrap_update | bool
  tags: [update]

# The never tag is not enough on its own. Role-level tags propagate onto every
# task, so --tags packages or --tags install names a tag this task carries,
# which is exactly what defeats never — and a full system upgrade is not what
# either of those asks for. bootstrap_update keys off the requested tags.
- name: Upgrade all packages
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest  # noqa package-latest - deliberate, only under --tags update
  when: bootstrap_update | bool
  tags: [update]

# The tarball is a flat archive of vale, LICENSE and README, so only the binary
# is worth unpacking. unarchive would re-download on every run if it were left
# to decide for itself, and creates: would pin whatever is already on disk, so
# compare versions instead: that way bumping vale_version reinstalls.
- name: Check the installed vale version
  ansible.builtin.command:
    cmd: "{{ local_bin }}/vale --version"
  register: packages_vale
  changed_when: false
  failed_when: false
  tags: [update]

- name: Install vale
  ansible.builtin.unarchive:
    src: "{{ vale_url }}"
    dest: "{{ local_bin }}"
    remote_src: true
    include: [vale]
    mode: "0755"
  when: vale_version not in packages_vale.stdout | default('', true)
  tags: [update]

# The installer is idempotent on its own: it resolves the latest release,
# compares it against what is on disk and exits early when they match. But
# there is no pinned version to key off the way vale has, so an ungated run
# would quietly upgrade the cli. Gate it like the rest of the role instead —
# install when aws is missing, upgrade only under --tags update.
#
# It verifies the download against AWS's signing key, which needs gpg; gnupg2
# and unzip are both in packages_fedora, installed by the task above.
- name: Check for the AWS CLI
  ansible.builtin.stat:
    path: "{{ local_bin }}/aws"
  register: packages_awscli
  tags: [update]

- name: Install the AWS CLI
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL "{{ awscli_install_url }}" | bash
    executable: /bin/bash
  environment:
    XDG_BIN_HOME: "{{ local_bin }}"
  register: packages_awscli_install
  changed_when: "'nothing to do' not in packages_awscli_install.stdout"
  when: not packages_awscli.stat.exists or bootstrap_update | bool
  tags: [update]

- name: Add the flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: user
    state: present

- name: Install flatpaks
  community.general.flatpak:
    name: "{{ packages_fedora_flatpaks }}"
    remote: flathub
    method: user
    state: present
